services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opsforge-backend
    ports:
      - "8000:8000"
    environment:
      - API_V1_STR=/api/v1
      - PROJECT_NAME=OpsForge
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres.lmglaazccinekrndvvqy:givemesunshine21lpa@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opsforge-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
